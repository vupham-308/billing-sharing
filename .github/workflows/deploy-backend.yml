name: Deploy Spring Boot Backend to Oracle VPS

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - "be/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy Spring Boot (Port 9000)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: 'be/pom.xml'

      - name: Build JAR with Maven
        working-directory: be
        run: mvn clean package -DskipTests -B --no-transfer-progress

      - name: Copy JAR to Oracle VPS via SSH Key
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER || 'ubuntu' }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          port: ${{ secrets.ORACLE_PORT || 22 }}
          source: "be/target/*.jar"
          target: "/home/ubuntu/app/billing-sharing/"
          strip_components: 2
          overwrite: true

      - name: Restart Backend Docker Container via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER || 'ubuntu' }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          port: ${{ secrets.ORACLE_PORT || 22 }}
          script: |
            echo "1. Chuẩn bị thư mục và chuẩn hóa tên file JAR..."
            mkdir -p /home/ubuntu/app/billing-sharing
            cd /home/ubuntu/app/billing-sharing

            LATEST_JAR=$(ls -t *.jar 2>/dev/null | grep -v '^billing-sharing.jar$' | head -1)
            if [ -n "$LATEST_JAR" ]; then
              mv -f "$LATEST_JAR" billing-sharing.jar
            fi
            chmod +x billing-sharing.jar

            echo "2. Khởi động lại container billing-sharing-backend (Port 9000)..."
            # Dừng và xóa container cũ để luôn áp dụng cấu hình mới nhất
            docker stop billing-sharing-backend 2>/dev/null || true
            docker rm billing-sharing-backend 2>/dev/null || true

            ENV_FILE_FLAG=""
            if [ -f /home/ubuntu/app/billing-sharing/.env ]; then
              ENV_FILE_FLAG="--env-file /home/ubuntu/app/billing-sharing/.env"
            fi

            # Khởi chạy container với port 9000 và nạp biến môi trường cô lập riêng biệt
            docker run -d \
              --name billing-sharing-backend \
              --restart always \
              --net=host \
              $ENV_FILE_FLAG \
              -v /home/ubuntu/app/billing-sharing:/app \
              eclipse-temurin:17-jre \
              java -Xms512m -Xmx1536m -jar /app/billing-sharing.jar --server.port=9000


            sleep 6
            docker ps --filter "name=billing-sharing-backend"

            echo "3. Kiểm tra sức khỏe Backend (Port 9000)..."
            curl -s -o /dev/null -w "HTTP Status: %{http_code}\n" http://localhost:9000/api/v1/auth/me || true
            echo "Triển khai Backend lên VPS Oracle ở cổng 9000 hoàn tất!"
