name: Deploy React Frontend to Oracle VPS

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - "fe/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy React Frontend (Port 3001)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'fe/package-lock.json'

      - name: Install Dependencies & Build Frontend
        working-directory: fe
        env:
          VITE_API_BASE_URL: https://api.kaidz.xyz/api/v1
        run: |
          npm ci
          npm run build

      - name: Copy Build Artifacts & Nginx Config to Oracle VPS via SSH Key
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER || 'ubuntu' }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          port: ${{ secrets.ORACLE_PORT || 22 }}
          source: "fe/dist/**,fe/nginx.conf"
          target: "/home/ubuntu/app/billing-sharing-frontend/"
          strip_components: 1
          overwrite: true

      - name: Restart Frontend Docker Container via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER || 'ubuntu' }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          port: ${{ secrets.ORACLE_PORT || 22 }}
          script: |
            echo "1. Chuẩn bị thư mục frontend..."
            mkdir -p /home/ubuntu/app/billing-sharing-frontend
            cd /home/ubuntu/app/billing-sharing-frontend

            echo "2. Khởi động lại container billing-sharing-frontend (Port 3001)..."
            # Dừng và xóa container cũ để luôn áp dụng bản build mới nhất
            docker stop billing-sharing-frontend 2>/dev/null || true
            docker rm billing-sharing-frontend 2>/dev/null || true

            APP_PORT=3001
            echo "-> Port Frontend sử dụng: $APP_PORT"

            # Đảm bảo có cấu hình nginx phù hợp cho SPA nếu chưa có
            if [ ! -f nginx.conf ]; then
              cat << 'EOF' > nginx.conf
            server {
                listen 3001;
                server_name _;

                root /usr/share/nginx/html;
                index index.html;

                location / {
                    try_files $uri $uri/ /index.html;
                }

                location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                    expires 1y;
                    add_header Cache-Control "public, no-transform";
                }
            }
            EOF
            fi

            # Khởi chạy container Nginx:
            # - Giới hạn RAM 256m, CPU 0.5 core
            # - --restart on-failure:1
            # - --net=host để lắng nghe trực tiếp trên cổng 3001 (đồng bộ chiến lược mạng với Backend)
            docker run -d \
              --name billing-sharing-frontend \
              --restart on-failure:1 \
              --memory="256m" \
              --cpus="0.5" \
              --net=host \
              -v /home/ubuntu/app/billing-sharing-frontend/dist:/usr/share/nginx/html:ro \
              -v /home/ubuntu/app/billing-sharing-frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro \
              nginx:alpine

            echo "3. Kiểm tra sức khỏe Frontend (Port $APP_PORT)..."
            READY=0
            for i in {1..10}; do
              sleep 2
              STATUS=$(docker inspect -f '{{.State.Status}}' billing-sharing-frontend 2>/dev/null || echo "unknown")
              if [ "$STATUS" != "running" ]; then
                echo "LỖI: Container bị dừng hoặc crash (Status: $STATUS). Log chi tiết:"
                docker logs --tail 40 billing-sharing-frontend
                exit 1
              fi

              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:${APP_PORT}/" || echo "000")
              if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "301" ] || [ "$HTTP_CODE" = "302" ]; then
                echo "-> Frontend phản hồi HTTP Status: $HTTP_CODE (Sẵn sàng sau $((i*2))s)"
                READY=1
                break
              fi
              echo "   Đang chờ Nginx sẵn sàng ($((i*2))s)..."
            done

            docker ps --filter "name=billing-sharing-frontend"

            if [ $READY -eq 1 ]; then
              echo "Triển khai Frontend lên VPS Oracle ở cổng $APP_PORT hoàn tất!"
            else
              echo "Cảnh báo: Frontend cần kiểm tra lại. Xem log bằng: docker logs -f billing-sharing-frontend"
            fi
