<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{title}}</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #1e293b;
    }
    .wrapper {
      width: 100%;
      background-color: #f8fafc;
      padding: 30px 0;
    }
    .container {
      max-width: 560px;
      margin: 0 auto;
      background-color: #ffffff;
      border-radius: 16px;
      border: 1px solid #e2e8f0;
      overflow: hidden;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }
    .header {
      background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%);
      padding: 28px 24px;
      text-align: center;
      color: #ffffff;
    }
    .header h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
    }
    .body {
      padding: 28px 24px;
    }
    .info-card {
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 16px;
      margin: 20px 0;
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
    }
    .info-label {
      color: #64748b;
      font-size: 14px;
    }
    .info-value {
      font-weight: 600;
      font-size: 14px;
      color: #0f172a;
    }
    .btn-container {
      text-align: center;
      margin: 28px 0 12px;
    }
    .btn {
      display: inline-block;
      background: #4f46e5;
      color: #ffffff !important;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      padding: 12px 28px;
      border-radius: 10px;
    }
    .footer {
      padding: 16px;
      text-align: center;
      font-size: 12px;
      color: #94a3b8;
      background-color: #f8fafc;
      border-top: 1px solid #e2e8f0;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="container">
      <div class="header">
        <h1>{{title}}</h1>
      </div>
      <div class="body">
        <p>Xin chào <strong>{{greetingName}}</strong>,</p>
        <p>{{message}}</p>

        <div class="info-card">
          <div class="info-row">
            <span class="info-label">Số tiền:</span>
            <span class="info-value" style="color: #4f46e5; font-size: 16px;">{{amount}} VND</span>
          </div>
          <div class="info-row">
            <span class="info-label">Khoản chi:</span>
            <span class="info-value">{{note}}</span>
          </div>
        </div>

        <div class="btn-container">
          <a href="{{actionUrl}}" class="btn" target="_blank">{{actionButtonText}}</a>
        </div>
      </div>
      <div class="footer">
        <p>ChiaTiền - Hệ thống quản lý và chia sẻ chi phí minh bạch</p>
      </div>
    </div>
  </div>
</body>
</html>
