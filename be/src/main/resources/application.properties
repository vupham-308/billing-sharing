spring.application.name=billing-sharing
server.port=${SERVER_PORT:6969}
server.forward-headers-strategy=framework

# SQL Server Database Configuration
spring.datasource.url=jdbc:sqlserver://${DB_HOST:${DB_URL:localhost}}:${DB_PORT:1433};databaseName=${DB_NAME:billing_sharing};encrypt=true;trustServerCertificate=true;sendStringParametersAsUnicode=true
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# HikariCP Connection Pool Optimization (Tiết kiệm CPU & RAM cho VPS nhỏ)
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:2}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${FORMAT_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.use_nationalized_character_data=true

# JWT Configuration (Access Token expiration: 30 days = 2592000000 ms)
application.security.jwt.secret-key=${JWT_SECRET_KEY:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
application.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:2592000000}

# Swagger / OpenAPI Configuration
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

brevo.api-key=${BREVO_API_KEY:}
brevo.sender-email=${BREVO_SENDER_EMAIL:billing-sharing@kaidz.xyz}
brevo.sender-name=${BREVO_SENDER_NAME:Billing Sharing}

# Frontend URL để tạo link reset password
app.frontend-url=${FRONTEND_URL:https://kaidz.xyz}

# Google OAuth Configuration
google.client-id=${GOOGLE_CLIENT_ID:985123336976-2632ov9ava66lnlp9bd7nuct12nibh6i.apps.googleusercontent.com}

